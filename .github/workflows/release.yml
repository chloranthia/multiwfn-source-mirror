name: Publish Multiwfn release

on:
  workflow_dispatch:

concurrency:
  group: publish-multiwfn-release
  queue: max
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  no_gui:
    name: Build no-GUI packages
    uses: ./.github/workflows/build-nogui.yml

  gui:
    name: Build GUI packages
    uses: ./.github/workflows/build-gui.yml

  release:
    name: Validate packages and publish release
    needs: [no_gui, gui]
    runs-on: ubuntu-26.04
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out the source revision
        uses: actions/checkout@v7.0.1

      - name: Download all platform packages
        uses: actions/download-artifact@v8.0.1
        with:
          path: release-assets
          merge-multiple: true

      - name: Validate packages and prepare release metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          source_version="$(python3 -c 'import json; print(json.load(open("upstream.json", encoding="utf-8"))["source_version"])')"
          source_sha="$(python3 -c 'import json; print(json.load(open("upstream.json", encoding="utf-8"))["download_sha256"])')"
          [[ "$source_version" =~ ^[A-Za-z0-9._-]+$ ]]
          [[ "$source_sha" =~ ^[0-9a-fA-F]{64}$ ]]
          release_tag="v${source_version}-${source_sha}"
          release_title="Multiwfn ${source_version}"

          expected_assets=(
            Multiwfn_noGUI-linux-x86_64.tar.gz
            Multiwfn_noGUI-linux-glibc228-x86_64.tar.gz
            Multiwfn_noGUI-macos-arm64.tar.gz
            Multiwfn_noGUI-macos-x86_64.tar.gz
            Multiwfn_noGUI-windows-x86_64.zip
            Multiwfn_GUI-linux-x86_64.tar.gz
            Multiwfn_GUI-macos-arm64.tar.gz
            Multiwfn_GUI-macos-x86_64.tar.gz
            Multiwfn_GUI-windows-x86_64.zip
          )
          for asset in "${expected_assets[@]}"; do
            test -s "release-assets/$asset"
            case "$asset" in
              *.tar.gz) tar -tzf "release-assets/$asset" >/dev/null ;;
              *.zip) unzip -tq "release-assets/$asset" >/dev/null ;;
            esac
          done
          test "$(find release-assets -maxdepth 1 -type f | wc -l)" -eq "${#expected_assets[@]}"
          (cd release-assets && sha256sum "${expected_assets[@]}" > SHA256SUMS.txt)

          {
            echo "release_tag=$release_tag"
            echo "release_title=$release_title"
          } >> "$GITHUB_OUTPUT"
          printf 'Multiwfn %s\n\n' "$source_version" > release-notes.md
          cat >> release-notes.md <<'EOF'
          Available builds:

          - Linux x86_64: GUI / noGUI. For older systems, use `Multiwfn_noGUI-linux-glibc228-x86_64.tar.gz` (glibc 2.28+).
          - macOS arm64 (Apple Silicon) / x86_64 (Intel): GUI / noGUI.
          - Windows x86_64: GUI / noGUI.

          Packages include runtime libraries and fractional derivative support. Extract the full archive, then run `Multiwfn` (GUI) or `Multiwfn_noGUI` (noGUI); use `.exe` on Windows.

          On Linux/macOS, set the package directory in your environment:

          ```sh
          export Multiwfnpath=/path/to/Multiwfn
          export PATH="$Multiwfnpath:$PATH"
          export OMP_STACKSIZE=200M
          ```

          GUI requires an X11 session on Linux or XQuartz on macOS.

          [Setup and usage](https://github.com/chloranthia/multiwfn-source-mirror/blob/main/README.md#ci-packages) · [Manual and citations](http://sobereva.com/multiwfn)

          Multiwfn is developed by Tian Lu. Package checksums are in `SHA256SUMS.txt`.
          EOF

      - name: Test release publishing policy
        run: python3 -m unittest discover -s tests -p test_release.py

      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.metadata.outputs.release_tag }}
          RELEASE_TITLE: ${{ steps.metadata.outputs.release_title }}
          TARGET_SHA: ${{ github.sha }}
        shell: bash
        run: bash scripts/publish_release.sh
